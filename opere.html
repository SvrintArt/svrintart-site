<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Opere - SvrintART</title>
    <style>
       body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Garamond', Georgia, serif;
            margin: 0; 
            padding: 60px 20px 120px 20px;
            font-size: 18px;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .nav-back {
            margin-bottom: 40px;
        }
        .nav-back a {
            color: #d4af37;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .gallery-title {
            color: #ffffff; 
            font-size: 42px; 
            letter-spacing: 3px; 
            text-align: center; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .gallery-subtitle {
            color: #a0a0a0; 
            font-size: 18px; 
            text-align: center; 
            letter-spacing: 2px; 
            margin-bottom: 60px;
        }
        
        /* LA GRIGLIA APERTA A TUTTO SCHERMO */
        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }
        .art-item {
            text-decoration: none;
            color: #ffffff;
            display: block;
        }
        .art-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* Miniature quadrate e perfettamente allineate */
            background-color: #141414;
            border: 1px solid #222;
            overflow: visible; /* Permette all'immagine di ingrandirsi FUORI dai bordi del quadratino */
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            z-index: 1;
        }
        .art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* EFFETTO HOVER REALE: Si ingrandisce verso l'esterno e va sopra agli altri elementi */
        .art-item:hover .art-box {
            border-color: #d4af37;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            z-index: 10; /* Porta la miniatura sopra a tutte le altre vicine */
        }
        .art-item:hover .art-box img {
            transform: scale(1.08); /* Zoom elegante e pulito dal centro verso l'esterno */
        }
        
        .art-caption {
            margin-top: 15px;
            font-size: 19px;
            letter-spacing: 1px;
            text-align: center;
            transition: color 0.3s ease;
        }
        .art-item:hover .art-caption {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-back">
            <a href="index.html">← HOME</a>
        </div>

        <h1 class="gallery-title">GALLERY</h1>
        <div class="gallery-subtitle">Seleziona un'opera per visionare i dettagli, il concept e le prospettive</div>

        <div class="art-grid">

            <!-- OPERA 1 -->
            <a href="gallery.html#opera-distante" class="art-item">
                <div class="art-box">
                    <img src="quadro01-fronte.jpg" alt="Manifesto dell'Arte Distante">
                </div>
                <div class="art-caption">Manifesto dell'Arte Distante</div>
            </a>

            <!-- OPERA 2 -->
            <a href="gallery.html#sguardo-amebico" class="art-item">
                <div class="art-box">
                    <img src="quadro02-fronte.jpg" alt="Sguardo amebico del genitore">
                </div>
                <div class="art-caption">Sguardo amebico del genitore</div>
            </a>

            <!-- OPERA 3 -->
            <a href="gallery.html#maldestro-tentativo" class="art-item">
                <div class="art-box">
                    <img src="quadro03-taglio 1.jpg" alt="Maldestro tentativo del genitore...">
                </div>
                <div class="art-caption">Maldestro tentativo del genitore...</div>
            </a>

            <!-- OPERA 4 -->
            <a href="gallery.html#genesis" class="art-item">
                <div class="art-box">
                    <img src="quadro04-a_fronte.jpg" alt="SvrintART 01 - Genesis">
                </div>
                <div class="art-caption">SvrintART 01 - Genesis</div>
            </a>

            <!-- OPERA 5 -->
            <a href="gallery.html#pianeti-oculari" class="art-item">
                <div class="art-box">
                    <img src="quadro05-a_fronte.jpg" alt="Pianeti oculari del genitore...">
                </div>
                <div class="art-caption">Pianeti oculari del genitore...</div>
            </a>

        </div>
    </div>

</body>
</html>
